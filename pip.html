<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>YouTube ワイプ</title>
    <!--
        ワイプ (Document Picture-in-Picture) の小窓の中で YouTube を再生するための中継ページ。
        PiP の小窓そのものは about:blank 扱いで、そこに直接 YouTube を埋め込むと
        リファラが付かずエラー 153 になる。この同一オリジンのページを小窓に読み込み、
        ここで IFrame API を読み込んで再生する (プレイヤーの生成は親ページの
        YouTubeManager が window.ytReady を待ってから行う)。
    -->
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        #pip-player, #pip-player iframe { width: 100%; height: 100%; border: 0; display: block; }
    </style>
</head>
<body>
    <div id="pip-player"></div>
    <script>
        window.ytReady = new Promise(function (resolve) {
            window.onYouTubeIframeAPIReady = function () { resolve(window.YT); };
        });
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
